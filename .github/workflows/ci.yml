name: CI

# The same gates as `make check`, with the same pinned tools (`make tools` installs them from
# tools/pins.tsv). No cloud credentials: init is always -backend=false, tests use mock providers.
# `CI OK` is the one required check (scripts/github-settings.sh).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tofu:
    name: OpenTofu (fmt, validate, tflint, checkov, tofu test, bats)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: make tools
      - name: Format (tofu fmt)
        run: make fmt
      - name: Validate (tofu validate)
        run: make validate
      - name: Lint (tflint)
        run: make tflint
      - name: IaC security scan (checkov)
        run: make checkov
      - name: Tests (tofu test, bats)
        run: make test

  repo:
    name: Repository (shellcheck, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: make tools
      - run: make shellcheck secrets

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: make tools
      - run: make actions

  # The single required check: it fails unless every job above succeeded (a skipped or cancelled job fails it).
  ci-ok:
    name: CI OK
    if: always()
    needs: [tofu, repo, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "::error::Jobs did not pass: ${bad//$'\n'/, }"
            exit 1
          fi
          echo "All jobs passed."
