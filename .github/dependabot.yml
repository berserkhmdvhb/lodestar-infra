# Version updates for the workflow actions and for the OpenTofu providers. The `opentofu` ecosystem
# (not `terraform`) reads registry.opentofu.org and regenerates each .terraform.lock.hcl with
# `tofu providers lock`, keeping the platforms already in the lock file. Provider pins are exact, so
# a bump is a reviewed pull request; CI runs validate and the mock-provider tests on it. A cooldown
# gives a new release 7 days to settle (the repository's pin rule). Titles are Conventional Commits,
# as pr-title.yml requires.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: opentofu
    directories:
      - /bootstrap
      - /envs/apps
      - /modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
